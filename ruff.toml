# =============================================================================
# 根级 CLI 脚本的 ruff 配置（`scripts/*.py`）
#
# 为什么单独一份：`backend/pyproject.toml` 的规则集是给**应用代码**定的，
# 而根级 `scripts/` 是**独立命令行工具**，有两处必然冲突：
#
#   T201  print       —— CLI 工具的输出方式就是 print，不是调试残留
#   S607  部分可执行路径 —— `git` / `python3` 走 PATH 是刻意为之（可移植性）
#
# 其余规则全部从后端配置继承，避免两套标准。
# 调用方式：在仓库根目录执行 `ruff check scripts`（ruff 会自动发现本文件）。
# =============================================================================

extend = "backend/pyproject.toml"

[lint.per-file-ignores]
"scripts/*.py" = ["T201", "S607"]
