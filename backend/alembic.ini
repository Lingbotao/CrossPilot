# =============================================================================
# Alembic 配置
# 迁移使用**独立的迁移账号**（DATABASE_MIGRATION_URL），与运行时账号分离 ——
# 运行时账号（crosspilot_app）不是表 owner，因此受 RLS 约束。
# 详见 infra/postgres/init/01-init.sql
# =============================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带时间戳，便于按顺序辨认
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url 由 alembic/env.py 从 settings.database_migration_url 注入，
# 不在这里写死（避免密钥进版本库）

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------- 日志
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
