# =============================================================================
# CrossPilot 开发全栈编排（M0-02）
#
#   make up      → 一键起全栈
#
# 服务拓扑：
#   postgres / redis / minio          基础设施
#   migrate                           一次性任务：跑完 Alembic 就退出
#   api / worker-high / worker-sync / worker-batch / worker-report / beat
#   web                               nginx 托管前端构建产物 + 反代 /api
#
# ⚠️ 容器内的连接串用**服务名**（postgres/redis/minio），不是 localhost；
#    .env 里的 localhost 是给"本机直跑进程"（make api / make web）用的。
#    两套并存是有意的，改的时候别把容器这套也改成 localhost。
# =============================================================================

name: crosspilot

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  TZ: UTC
  # 运行时账号（受 RLS 约束）
  DATABASE_URL: postgresql+asyncpg://crosspilot_app:crosspilot_app_pwd@postgres:5432/crosspilot
  # 迁移账号（表 owner，绕过 RLS，只在 migrate 服务里用）
  DATABASE_MIGRATION_URL: postgresql+asyncpg://crosspilot_owner:crosspilot_owner_pwd@postgres:5432/crosspilot
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdefghijklmnop}
  JWT_ALG: ${JWT_ALG:-HS256}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  # 开发用固定密钥；生产必须换成 KMS 托管的随机值
  CREDENTIAL_AES_KEY: ${CREDENTIAL_AES_KEY:-ZGV2LW9ubHktYWVzMjU2LWtleS0zMmJ5dGVzISE=}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET_PRODUCT_IMAGE: crosspilot-product
  S3_BUCKET_CERTIFICATE: crosspilot-cert
  S3_BUCKET_EXPORT: crosspilot-export
  S3_USE_SSL: "false"
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000/api/v1/shops/oauth/callback}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  SNOWFLAKE_WORKER_ID: "1"

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  # ---------------------------------------------------------------- 基础设施
  postgres:
    image: postgres:16-alpine
    container_name: crosspilot-postgres
    environment:
      POSTGRES_USER: crosspilot_owner
      POSTGRES_PASSWORD: crosspilot_owner_pwd
      POSTGRES_DB: crosspilot
      TZ: UTC
      PGTZ: UTC
    # 全系统统一 UTC：平台签名校验对时间戳偏差极敏感（Shopee 偏差 >15min 直接认证失败）
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 只在**首次初始化**时执行（创建 crosspilot_app 角色 + RLS 前置自检）
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspilot_owner -d crosspilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crosspilot-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: crosspilot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: crosspilot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/crosspilot-product local/crosspilot-cert local/crosspilot-export &&
      mc anonymous set none local/crosspilot-cert &&
      echo '[minio-init] 三个桶已就绪（证书桶为私有）'
      "
    restart: "no"

  # ---------------------------------------------------------------- 迁移（一次性）
  migrate:
    <<: *backend-build
    container_name: crosspilot-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- 应用进程
  api:
    <<: *backend-build
    container_name: crosspilot-api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 迁移没跑完就不启动 —— 否则会因为表不存在而反复重启
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # 死信队列只声明，不在这里消费。人工重放走 sync_engine.DeadLetterQueue.replay_next。
  worker-high:
    <<: *backend-build
    container_name: crosspilot-worker-high
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "high", "--concurrency", "8", "-n", "high@%h"]
    environment: *backend-env
    depends_on: &worker-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-sync:
    <<: *backend-build
    container_name: crosspilot-worker-sync
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "sync,sync.amazon,sync.shopee,sync.lazada,sync.tiktok", "--concurrency", "4", "-n", "sync@%h"]
    environment: *backend-env
    depends_on: *worker-depends
    restart: unless-stopped

  worker-batch:
    <<: *backend-build
    container_name: crosspilot-worker-batch
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "batch", "--concurrency", "4", "-n", "batch@%h"]
    environment: *backend-env
    depends_on: *worker-depends
    restart: unless-stopped

  worker-report:
    <<: *backend-build
    container_name: crosspilot-worker-report
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "report", "--concurrency", "2", "-n", "report@%h"]
    environment: *backend-env
    depends_on: *worker-depends
    restart: unless-stopped

  beat:
    <<: *backend-build
    container_name: crosspilot-beat
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "-l", "info"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- 前端
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: crosspilot-web
    depends_on:
      - api
    # nginx 配置的唯一事实来源在 infra/nginx/，只读挂载进来
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
