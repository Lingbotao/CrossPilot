# =============================================================================
# CI 三关（开发规划 §3.3）：lint/type → test → frontend
#
# 单人项目也要有门禁 —— 没有门禁的"我自己会注意"就是没有标准。
# 每一关都是**硬失败**：任何一步红，PR 不允许合并。
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新推送取消上一次未跑完的任务，省额度也更快拿到结果
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------ 第零关：仓库卫生
  repo-hygiene:
    name: 仓库卫生（密钥扫描 + shell 可移植性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pre-commit 可被 --no-verify 绕过，CI 才是硬门禁
      - name: 密钥扫描（C5 / NFR-S-02）
        run: |
          python3 scripts/check_secrets.py --self-test   # 规则本身的自检：别把检出能力改坏
          python3 scripts/check_secrets.py

      - name: shell 可移植性（$VAR 后不得紧跟非 ASCII）
        run: python3 scripts/check_shell_locale.py --all

  # ------------------------------------------------------------------ 第一关：静态质量
  backend-quality:
    name: 后端静态检查（ruff + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff（lint + format 检查）
        working-directory: backend
        run: |
          ruff check app tests scripts alembic
          ruff format --check app tests scripts alembic

      # 根级 scripts/ 是独立 CLI 工具，走仓库根的 ruff.toml（T201 print 等已按文件忽略）
      - name: ruff（根级 CLI 脚本）
        run: |
          ruff check scripts
          ruff format --check scripts

      - name: mypy（类型检查）
        working-directory: backend
        run: mypy app

  # ------------------------------------------------------------------ 第二关：测试
  backend-test:
    name: 后端测试（含多租户越权用例）
    runs-on: ubuntu-latest
    needs: backend-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crosspilot_owner
          POSTGRES_PASSWORD: crosspilot_owner_pwd
          POSTGRES_DB: crosspilot
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crosspilot_owner -d crosspilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      LOG_FORMAT: console
      DATABASE_URL: postgresql+asyncpg://crosspilot_app:crosspilot_app_pwd@localhost:5432/crosspilot
      DATABASE_MIGRATION_URL: postgresql+asyncpg://crosspilot_owner:crosspilot_owner_pwd@localhost:5432/crosspilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz
      CREDENTIAL_AES_KEY: Y2ktb25seS1hZXMyNTYta2V5LTMyLWJ5dGVzISE=   # 占位符：解码即 ci-only-aes256-key-32-bytes!!   secret-scan: allow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 创建运行时角色（crosspilot_app，受 RLS 约束）
        env:
          PGPASSWORD: crosspilot_owner_pwd
        run: |
          psql -h localhost -U crosspilot_owner -d crosspilot -v ON_ERROR_STOP=1 \
            -f infra/postgres/init/01-init.sql

      - name: 执行迁移
        working-directory: backend
        run: alembic upgrade head

      - name: ★ 校验「模型定义」与「迁移脚本」一致
        working-directory: backend
        # alembic check：如果 autogenerate 会产出新的变更，说明模型改了但迁移没跟上。
        # 这条门禁专门防"改了模型忘了写迁移"，靠人工 review 是漏得掉的。
        run: alembic check

      - name: 写入开发种子数据
        working-directory: backend
        run: python -m scripts.seed_dev

      - name: pytest（含覆盖率门禁）
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------ 第三关：前端
  frontend-quality:
    name: 前端检查（eslint + tsc + 单测 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 单元测试
        working-directory: frontend
        run: npm run test

      - name: 构建
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------------ 镜像可构建性
  docker-build:
    name: 镜像构建（后端 + 前端）
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
