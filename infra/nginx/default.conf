upstream api_backend {
    # docker compose 的服务名即 DNS 名；多个 api 副本时 nginx 会自动轮询
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------ 安全响应头
    # 前端是 SPA，且要拿 OAuth 回调，这几项是底线配置
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 32m;   # 商品图片上传（M3）

    # ------------------------------------------------------------------ API 反向代理
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # api 侧 client_ip() 读的就是这个头 —— 应用不允许直连公网，所以可信
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 报表导出（M5）可能耗时较长，超时要给够
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 健康探针不打 access log，避免刷日志
    location = /healthz {
        proxy_pass http://api_backend/healthz;
        access_log off;
    }

    # ------------------------------------------------------------------ 静态资源
    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：任何非文件路径都交给 index.html，否则刷新页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
